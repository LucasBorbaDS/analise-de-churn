version = "0.1.0"
description = "Análise exploratória e modelagem estatística de churn com regressão logística para telecomunicações"
readme = "README.md"
authors = [
    { name = "LucasBorbaDS", email = "borbalucas33@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "nbformat>=5.11.1",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "seaborn>=0.13.2",
    "statsmodels>=0.15.0",
    "watermark>=2.6.0",
]

[tool.uv]
package = false

